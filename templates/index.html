<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RSA Encryption Tool</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 650px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    background: white;
  }
  h1 { font-size: 26px; }
  h2 { font-size: 18px; margin-top: 30px; }
  label { display: block; margin: 12px 0 5px; }
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  textarea { height: 75px; }
  button {
    background: #222;
    color: white;
    border: none;
    padding: 10px 14px;
    margin: 8px 5px 8px 0;
    border-radius: 5px;
    cursor: pointer;
  }
  button:hover { background: #444; }
  section {
    border-bottom: 1px solid #ddd;
    padding-bottom: 25px;
  }
  .result { background: #f5f5f5; }
  .error { color: #b00020; }
  .message { color: #287a38; }
</style>
</head>
<body>

<h1>RSA Encryption Tool</h1>
<p>Simple RSA key generation, encryption and decryption.</p>

<section>
  <h2>1. Generate Keys</h2>
  <label>Prime size (bits)</label>
<input id="bits" type="number" min="11" max="512" placeholder="Enter prime size">  <button onclick="generateKeys()">Generate Keys</button>

  <label>Public Key (e,n)</label>
  <input id="pubKey" placeholder="Public key">
  <button onclick="copyValue('pubKey')">Copy</button>

  <label>Private Key (d,n)</label>
  <input id="privKey" placeholder="Private key">
  <button onclick="copyValue('privKey')">Copy</button>

  <p id="params" style="word-break: break-all;"></p>

  <p>
    <button onclick="saveKeys()">Save Keys</button>
    <button onclick="document.getElementById('file').click()">
      Load Keys
    </button>
    <input type="file" id="file" accept=".txt"
           style="display:none" onchange="loadKeys(event)">
  </p>
  <p id="keyMessage"></p>
</section>

<section>
  <h2>2. Encrypt Text</h2>
  <label>Text</label>
  <textarea id="plain" placeholder="Enter text"></textarea>

  <label>Public Key</label>
  <input id="encKey" placeholder="e,n">
  <button onclick="useKey('pubKey','encKey')">Use Public Key</button>
  <button onclick="encrypt()">Encrypt</button>

  <label>Encrypted Result</label>
  <textarea id="cipherOut" class="result" readonly></textarea>
  <button onclick="copyValue('cipherOut')">Copy Result</button>
  <p id="encMessage" class="error"></p>
</section>

<section>
  <h2>3. Decrypt Text</h2>
  <label>Encrypted Numbers</label>
  <textarea id="cipherIn" placeholder="Enter encrypted numbers"></textarea>

  <label>Private Key</label>
  <input id="decKey" placeholder="d,n">
  <button onclick="useKey('privKey','decKey')">Use Private Key</button>
  <button onclick="decrypt()">Decrypt</button>

  <label>Decrypted Result</label>
  <textarea id="plainOut" class="result" readonly></textarea>
  <p id="decMessage" class="error"></p>
</section>

<script>
async function post(url, data) {
  const response = await fetch(url, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(data)
  });
  return await response.json();
}

function message(id, text) {
  document.getElementById(id).textContent = text;
}

async function generateKeys() {
  message("keyMessage", "");
  message("params", "");
  try {
    const r = await post("/api/generate", {
      bits: document.getElementById("bits").value
    });
    if (!r.ok) throw new Error(r.error);

    document.getElementById("pubKey").value =
      r.keys.e + "," + r.keys.n;
    document.getElementById("privKey").value =
      r.keys.d + "," + r.keys.n;
    message("params", "p=" + r.keys.p + ", q=" + r.keys.q +
      ", n=" + r.keys.n + ", phi=" + r.keys.phi);
    message("keyMessage", "Keys generated successfully.");
  } catch (err) {
    message("keyMessage", err.message);
  }
}

function useKey(from, to) {
  document.getElementById(to).value =
    document.getElementById(from).value;
}

async function copyValue(id) {
  const value = document.getElementById(id).value;
  if (!value) return alert("Nothing to copy.");
  try {
    await navigator.clipboard.writeText(value);
  } catch (err) {
    alert("Copy failed. Please copy manually.");
  }
}

async function encrypt() {
  message("encMessage", "");
  document.getElementById("cipherOut").value = "";
  try {
    const r = await post("/api/encrypt", {
      text: document.getElementById("plain").value,
      key: document.getElementById("encKey").value
    });
    if (!r.ok) throw new Error(r.error);
    document.getElementById("cipherOut").value = r.result;
  } catch (err) {
    message("encMessage", err.message);
  }
}

async function decrypt() {
  message("decMessage", "");
  document.getElementById("plainOut").value = "";
  try {
    const r = await post("/api/decrypt", {
      text: document.getElementById("cipherIn").value,
      key: document.getElementById("decKey").value
    });
    if (!r.ok) throw new Error(r.error);
    document.getElementById("plainOut").value = r.result;
  } catch (err) {
    message("decMessage", err.message);
  }
}

function saveKeys() {
  const pub = document.getElementById("pubKey").value;
  const priv = document.getElementById("privKey").value;
  if (!pub || !priv) return alert("Generate keys first.");

  const content = "PUBLIC_KEY=" + pub +
                  "\nPRIVATE_KEY=" + priv + "\n";
  const blob = new Blob([content], {type: "text/plain"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "rsa_keys.txt";
  link.click();
  URL.revokeObjectURL(url);
}

function loadKeys(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function() {
    const text = reader.result;
    const pub = text.match(/^PUBLIC_KEY=(.+)$/m);
    const priv = text.match(/^PRIVATE_KEY=(.+)$/m);

    if (!pub || !priv) {
      message("keyMessage", "Invalid key file.");
      return;
    }

    const valid = /^\d+,\d+$/;
    if (!valid.test(pub[1].trim()) ||
        !valid.test(priv[1].trim())) {
      message("keyMessage", "Invalid key values.");
      return;
    }

    document.getElementById("pubKey").value = pub[1].trim();
    document.getElementById("privKey").value = priv[1].trim();
    message("keyMessage", "Keys loaded successfully.");
  };
  reader.onerror = function() {
    message("keyMessage", "Could not read the file.");
  };
  reader.readAsText(file);
  event.target.value = "";
}
</script>
</body>
</html>
